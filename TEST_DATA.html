<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>TEST_DATA - Nube de Puntos</title>

	<!-- Librerías vía CDN -->
	<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/potree@1.8.0/build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css">
	<link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/spectrum/1.8.0/spectrum.min.css">
</head>

<body>
	<!-- Scripts vía CDN -->
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/spectrum/1.8.0/spectrum.min.js"></script>
	<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/potree@1.8.0/build/potree/potree.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.12/jstree.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/plasio@0.0.12/js/laslaz.min.js"></script>
	
	<!-- Tus dependencias adicionales aquí -->
	<!-- Configuraciones aquí -->
	
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('https://cdn.jsdelivr.net/npm/potree@1.8.0/build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"> </div>
	</div>
	
	<script>
	
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(8_000_000);
		
		// Configuración adicional
		material.shape = Potree.PointShape.CIRCLE;
		viewer.setBackground("skybox");
		
		viewer.loadSettingsFromURL();
		
		viewer.setDescription('<a href="https://www.allen-company.com/advanced-technologies/" target="_blank" rel="noopener noreferrer"> <img src="https://i0.wp.com/www.allen-company.com/wp-content/uploads/2020/03/allen-and-company-logo-web-founded-1988-2.png?w=600&ssl=1" width="220"> ');
		
		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
			$("#menu_tools").next().show();
			$("#menu_clipping").next().show();
			viewer.toggleSidebar();
		});
		
		// Configuración de proyección (si es necesario)
		proj4.defs("EPSG:6438", "+proj=tmerc +lat_0=24.3333333333333 +lon_0=-81 +k=0.999941177 +x_0=200000.0001016 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=us-ft +no_defs +type=crs");

		Potree.loadPointCloud("./pointclouds/TEST_DATA/metadata.json", "TEST_DATA", e => {
			let scene = viewer.scene;
			let pointcloud = e.pointcloud;
			
			// Asignar proyección
			pointcloud.projection = "EPSG:6438";
			
			let material = pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;
			material.activeAttributeName = "rgba";
			
			scene.addPointCloud(pointcloud);
			
			// Comentar fitToScreen si se usan coordenadas específicas
			// viewer.fitToScreen();
			
			// Posición de cámara personalizada
			viewer.scene.view.position.set(498618.916, 5460926.690, 61.725);
			viewer.scene.view.lookAt(498566.349, 5460949.814, 31.622);
			viewer.setLengthUnit('ft');
		});

	</script>
	
  </body>
</html>
