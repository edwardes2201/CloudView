<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer</title>

	<link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./libs/potree/potree.js"></script>
	<script src="./libs/plasio/js/laslaz.js"></script>
	
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"> </div>
	</div>
	
	<script>
	
		// ============================================================
		// VARIABLE GLOBAL
		// ============================================================
		
		let viewer;
		let loadAttempted = false;
		
		// ============================================================
		// FUNCIONES DE PERSISTENCIA
		// ============================================================
		
		function saveMeasurements() {
			try {
				if (!viewer || !viewer.scene) return;
				
				const measurements = viewer.scene.measurements;
				const data = measurements.map(m => ({
					uuid: m.uuid || 'm_' + Date.now(),
					name: m.name || 'Measurement',
					points: m.points.map(p => ({ x: p.position.x, y: p.position.y, z: p.position.z })),
					showDistances: m.showDistances !== undefined ? m.showDistances : true,
					showCoordinates: m.showCoordinates || false,
					showArea: m.showArea || false,
					closed: m.closed || false,
					showAngles: m.showAngles || false,
					showHeight: m.showHeight || false,
					showCircle: m.showCircle || false,
					showAzimuth: m.showAzimuth || false,
					showEdges: m.showEdges !== undefined ? m.showEdges : true,
					color: m.color ? m.color.toArray() : [1, 0, 0]
				}));
				
				localStorage.setItem('potree_measurements', JSON.stringify(data));
				console.log('💾 Mediciones guardadas:', data.length);
			} catch(e) {
				console.error('Error guardando:', e);
			}
		}
		
		function loadMeasurements() {
			try {
				if (!viewer || !viewer.scene) {
					console.warn('⚠️ Viewer no disponible');
					return;
				}
				
				// Verificar que THREE esté disponible
				if (typeof THREE === 'undefined') {
					console.warn('⏳ THREE no disponible, esperando...');
					setTimeout(loadMeasurements, 200);
					return;
				}
				
				const saved = localStorage.getItem('potree_measurements');
				if (!saved) {
					console.log('ℹ️ No hay mediciones guardadas');
					return;
				}
				
				const data = JSON.parse(saved);
				console.log('📐 Cargando', data.length, 'mediciones...');
				
				let count = 0;
				data.forEach((item, index) => {
					try {
						const measure = new Potree.Measure();
						
						measure.uuid = item.uuid || 'm_' + Date.now() + '_' + index;
						measure.name = item.name || 'Measurement';
						measure.showDistances = item.showDistances !== undefined ? item.showDistances : true;
						measure.showCoordinates = item.showCoordinates || false;
						measure.showArea = item.showArea || false;
						measure.closed = item.closed || false;
						measure.showAngles = item.showAngles || false;
						measure.showHeight = item.showHeight || false;
						measure.showCircle = item.showCircle || false;
						measure.showAzimuth = item.showAzimuth || false;
						measure.showEdges = item.showEdges !== undefined ? item.showEdges : true;
						
						if (item.color) {
							measure.color.setRGB(item.color[0], item.color[1], item.color[2]);
						}
						
						if (item.points && item.points.length > 0) {
							item.points.forEach(p => {
								const pos = new THREE.Vector3(p.x, p.y, p.z);
								measure.addMarker(pos);
							});
						}
						
						viewer.scene.addMeasurement(measure);
						count++;
						
						// Configurar listeners
						['marker_moved', 'marker_added', 'marker_removed'].forEach(e => {
							measure.addEventListener(e, () => setTimeout(saveMeasurements, 50));
						});
						
					} catch(e) {
						console.error('Error en medición', index, ':', e);
					}
				});
				
				console.log('✅ Mediciones cargadas:', count);
				loadAttempted = true;
				
			} catch(e) {
				console.error('Error cargando:', e);
			}
		}
		
		// ============================================================
		// INICIALIZACIÓN
		// ============================================================
		
		console.log('🚀 Inicializando Potree Viewer...');
		
		viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(8_000_000);
		viewer.loadSettingsFromURL();
		
		viewer.setDescription("");
		
		viewer.loadGUI(() => {
			console.log('🎨 GUI cargada');
			
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
			$("#menu_tools").next().show();
			$("#menu_clipping").next().show();
			viewer.toggleSidebar();
		});
		
		// ============================================================
		// EVENTOS
		// ============================================================
		
		viewer.scene.addEventListener('measurement_added', function(e) {
			console.log('📏 Medición añadida:', e.measurement.name);
			
			['marker_moved', 'marker_added', 'marker_removed'].forEach(ev => {
				e.measurement.addEventListener(ev, () => setTimeout(saveMeasurements, 50));
			});
			
			setTimeout(saveMeasurements, 100);
		});
		
		viewer.scene.addEventListener('measurement_removed', function(e) {
			console.log('🗑️ Medición eliminada:', e.measurement.name);
			saveMeasurements();
		});
		
		window.addEventListener('beforeunload', saveMeasurements);
		
		// ============================================================
		// CARGA DE NUBE DE PUNTOS + MEDICIONES
		// ============================================================
		
		console.log('☁️ Cargando nube de puntos...');
		
		Potree.loadPointCloud("./pointclouds/TEST_DATA/metadata.json", "TEST_DATA", e => {
			console.log('✅ Nube de puntos cargada');
			
			let scene = viewer.scene;
			let pointcloud = e.pointcloud;
			
			let material = pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.FIXED;
			material.shape = Potree.PointShape.CIRCLE;
			material.activeAttributeName = "rgba";
			
			scene.addPointCloud(pointcloud);
			viewer.fitToScreen();
			
			// ⭐ Cargar mediciones DESPUÉS de la nube
			console.log('📂 Cargando mediciones guardadas...');
			loadMeasurements();
			
			console.log('✅ Proceso completado');
		});
		
		// ============================================================
		// BOTÓN DE PRUEBA
		// ============================================================
		
		setTimeout(() => {
			const btn = document.createElement('button');
			btn.textContent = '💾 Guardar';
			btn.style.cssText = 'position:absolute; bottom:200px; right:20px; z-index:9999; padding:10px 20px; background:#4CAF50; color:white; border:none; border-radius:5px; cursor:pointer;';
			btn.onclick = saveMeasurements;
			document.body.appendChild(btn);
		}, 3000);
		
	</script>
	
</body>
</html>
