<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Potree Viewer - Mediciones con Capas</title>

	<link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
	
	<style>
		/* Estilos para el panel de capas */
		#toggleLayerBtn {
			position: absolute;
			top: 80px;
			right: 10px;
			background: rgba(25, 40, 44, 0.85);
			border: 1px solid #39474B;
			color: #cccccc;
			padding: 8px 12px;
			border-radius: 4px;
			z-index: 1001;
			cursor: pointer;
			font-size: 14px;
			user-select: none;
			font-family: Arial, sans-serif;
		}

		#toggleLayerBtn:hover {
			background: rgba(45, 109, 130, 0.85);
		}

		.measurement-layer-control {
			position: absolute;
			top: 120px;
			right: 10px;
			background: rgba(25, 40, 44, 0.95);
			color: #cccccc;
			padding: 15px;
			border-radius: 4px;
			z-index: 1000;
			min-width: 220px;
			border: 1px solid #39474B;
			display: none;
			max-height: 70vh;
			overflow-y: auto;
			box-shadow: 0 4px 15px rgba(0,0,0,0.5);
			font-family: Arial, sans-serif;
			font-size: 13px;
		}

		.measurement-layer-control h4 {
			margin: 0 0 10px 0;
			color: #ffffff;
		}

		.measurement-layer-control .close-btn {
			background: none;
			border: none;
			color: #cccccc;
			cursor: pointer;
			font-size: 18px;
			float: right;
			padding: 0 4px;
		}

		.measurement-layer-control .close-btn:hover {
			color: #ffffff;
		}

		.layer-item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			padding: 4px 8px;
			margin: 2px 0;
			background: #39474B;
			border-radius: 3px;
			cursor: pointer;
			transition: background 0.2s;
		}

		.layer-item:hover {
			background: #4a5a5f;
		}

		.layer-item .layer-name {
			flex: 1;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.layer-item .layer-color {
			width: 12px;
			height: 12px;
			border-radius: 50%;
			border: 1px solid #666;
			display: inline-block;
			flex-shrink: 0;
		}

		.layer-item .layer-actions {
			display: flex;
			gap: 4px;
		}

		.layer-item .layer-actions button {
			background: none;
			border: none;
			color: #cccccc;
			cursor: pointer;
			padding: 2px 4px;
			font-size: 14px;
			border-radius: 3px;
		}

		.layer-item .layer-actions button:hover {
			background: rgba(255,255,255,0.1);
		}

		.layer-item .layer-count {
			font-size: 11px;
			color: #888;
			margin-left: 4px;
		}

		.layer-input-row {
			display: flex;
			gap: 5px;
			margin-top: 10px;
		}

		.layer-input-row input {
			flex: 1;
			padding: 4px 8px;
			background: #39474B;
			border: 1px solid #19282C;
			color: white;
			border-radius: 3px;
			outline: none;
		}

		.layer-input-row input:focus {
			border-color: #108FB9;
		}

		.layer-input-row button {
			padding: 4px 12px;
			background: #2D6D82;
			border: none;
			color: white;
			border-radius: 3px;
			cursor: pointer;
		}

		.layer-input-row button:hover {
			background: #3d8da2;
		}

		.layer-actions-row {
			display: flex;
			gap: 5px;
			margin-top: 8px;
		}

		.layer-actions-row button {
			flex: 1;
			padding: 4px;
			background: #39474B;
			border: 1px solid #19282C;
			color: white;
			border-radius: 3px;
			cursor: pointer;
			font-size: 12px;
		}

		.layer-actions-row button:hover {
			background: #4a5a5f;
		}

		.layer-actions-row .btn-danger {
			background: #5c2d2d;
		}

		.layer-actions-row .btn-danger:hover {
			background: #7a3d3d;
		}

		.layer-actions-row .btn-success {
			background: #2d6d5c;
		}

		.layer-actions-row .btn-success:hover {
			background: #3d8d7a;
		}

		#measurementCount {
			font-size: 11px;
			color: #888;
			text-align: center;
			display: block;
			margin-top: 8px;
		}
		
		/* Scrollbar personalizada */
		.measurement-layer-control::-webkit-scrollbar {
			width: 4px;
		}
		
		.measurement-layer-control::-webkit-scrollbar-thumb {
			background: #39474B;
			border-radius: 2px;
		}
	</style>
</head>

<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./libs/potree/potree.js"></script>
	<script src="./libs/plasio/js/laslaz.js"></script>
	
	<!-- INCLUDE ADDITIONAL DEPENDENCIES HERE -->
	<!-- INCLUDE SETTINGS HERE -->
	
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"> </div>
	</div>
	
	<!-- Botón para mostrar/ocultar el panel de capas -->
	<button id="toggleLayerBtn">📐 Capas</button>

	<!-- Panel de control de capas -->
	<div id="measurementLayerControl" class="measurement-layer-control">
		<button class="close-btn" id="toggleLayerPanel">✕</button>
		<h4>📐 Capas de Mediciones</h4>
		
		<div id="layerList">
			<!-- Las capas se renderizan aquí dinámicamente -->
		</div>
		
		<div class="layer-input-row">
			<input id="newLayerInput" type="text" placeholder="Nueva capa...">
			<button id="addLayerBtn">+</button>
		</div>
		
		<div class="layer-actions-row">
			<button id="saveMeasurementsBtn" class="btn-success">💾 Guardar</button>
			<button id="clearMeasurementsBtn" class="btn-danger">🗑 Limpiar</button>
		</div>
		
		<span id="measurementCount">0 mediciones</span>
	</div>
	
	<script>
	
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(8_000_000);
		<!-- INCLUDE SETTINGS HERE -->
		viewer.loadSettingsFromURL();
		
		viewer.setDescription("");
		
		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
			$("#menu_tools").next().show();
			$("#menu_clipping").next().show();
			viewer.toggleSidebar();
		});
		
		// --- Cargar los scripts de extensión dinámicamente ---
		function loadScript(src) {
			return new Promise((resolve, reject) => {
				const script = document.createElement('script');
				script.src = src;
				script.onload = resolve;
				script.onerror = reject;
				document.head.appendChild(script);
			});
		}

		// --- Cargar las extensiones ---
		Promise.all([
			loadScript('./js/potree-extend.js'),
			loadScript('./js/measurements-storage.js'),
			loadScript('./js/measurements-ui.js')
		]).then(() => {
			console.log('Extensiones cargadas correctamente');
			
			// Inicializar el sistema de capas
			viewer.onGUILoaded(() => {
				console.log('Inicializando sistema de capas...');
				
				if (typeof MeasurementsStorage !== 'undefined' && typeof MeasurementsUI !== 'undefined') {
					window.measurementStorage = new MeasurementsStorage(viewer);
					window.measurementsUI = new MeasurementsUI(viewer, window.measurementStorage);
					
					// Cargar mediciones guardadas
					const count = window.measurementStorage.loadMeasurements();
					console.log(`Cargadas ${count} mediciones`);
				} else {
					console.error('No se pudieron cargar las extensiones');
				}
			});
		}).catch(err => {
			console.error('Error cargando extensiones:', err);
		});

		// --- Cargar la nube de puntos ---
		Potree.loadPointCloud("./pointclouds/TEST_DATA/metadata.json", "TEST_DATA", e => {
			let scene = viewer.scene;
			let pointcloud = e.pointcloud;
			
			let material = pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.FIXED;
			material.shape = Potree.PointShape.CIRCLE;
			material.activeAttributeName = "rgba";
			
			scene.addPointCloud(pointcloud);
			
			viewer.fitToScreen();
		});

	</script>
	
</body>
</html>
