<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Potree Viewer - Mediciones con Capas</title>

    <link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
    <link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
    <link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
    <link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
    <link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
    
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
        
        #potree_render_area {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }
        
        #potree_sidebar_container {
            position: absolute;
            z-index: 0;
            width: 350px;
            height: 100%;
            overflow-y: scroll;
            font-size: 85%;
            border-right: 1px solid black;
            background-color: #19282C;
            display: none;
        }

        #toggleLayerBtn {
            position: absolute;
            top: 80px;
            right: 10px;
            background: rgba(25, 40, 44, 0.85);
            border: 1px solid #39474B;
            color: #cccccc;
            padding: 8px 12px;
            border-radius: 4px;
            z-index: 1001;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
            font-family: Arial, sans-serif;
        }

        #toggleLayerBtn:hover {
            background: rgba(45, 109, 130, 0.85);
        }

        .measurement-layer-control {
            position: absolute;
            top: 120px;
            right: 10px;
            background: rgba(25, 40, 44, 0.95);
            color: #cccccc;
            padding: 15px;
            border-radius: 4px;
            z-index: 1000;
            min-width: 220px;
            border: 1px solid #39474B;
            display: none;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        .measurement-layer-control h4 {
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .measurement-layer-control .close-btn {
            background: none;
            border: none;
            color: #cccccc;
            cursor: pointer;
            font-size: 18px;
            float: right;
            padding: 0 4px;
        }

        .measurement-layer-control .close-btn:hover {
            color: #ffffff;
        }

        .layer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            margin: 2px 0;
            background: #39474B;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .layer-item:hover {
            background: #4a5a5f;
        }

        .layer-item .layer-name {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .layer-item .layer-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #666;
            display: inline-block;
            flex-shrink: 0;
        }

        .layer-item .layer-actions {
            display: flex;
            gap: 4px;
        }

        .layer-item .layer-actions button {
            background: none;
            border: none;
            color: #cccccc;
            cursor: pointer;
            padding: 2px 4px;
            font-size: 14px;
            border-radius: 3px;
        }

        .layer-item .layer-actions button:hover {
            background: rgba(255,255,255,0.1);
        }

        .layer-item .layer-count {
            font-size: 11px;
            color: #888;
            margin-left: 4px;
        }

        .layer-input-row {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .layer-input-row input {
            flex: 1;
            padding: 4px 8px;
            background: #39474B;
            border: 1px solid #19282C;
            color: white;
            border-radius: 3px;
            outline: none;
        }

        .layer-input-row input:focus {
            border-color: #108FB9;
        }

        .layer-input-row button {
            padding: 4px 12px;
            background: #2D6D82;
            border: none;
            color: white;
            border-radius: 3px;
            cursor: pointer;
        }

        .layer-input-row button:hover {
            background: #3d8da2;
        }

        .layer-actions-row {
            display: flex;
            gap: 5px;
            margin-top: 8px;
        }

        .layer-actions-row button {
            flex: 1;
            padding: 4px;
            background: #39474B;
            border: 1px solid #19282C;
            color: white;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .layer-actions-row button:hover {
            background: #4a5a5f;
        }

        .layer-actions-row .btn-danger {
            background: #5c2d2d;
        }

        .layer-actions-row .btn-danger:hover {
            background: #7a3d3d;
        }

        .layer-actions-row .btn-success {
            background: #2d6d5c;
        }

        .layer-actions-row .btn-success:hover {
            background: #3d8d7a;
        }

        #measurementCount {
            font-size: 11px;
            color: #888;
            text-align: center;
            display: block;
            margin-top: 8px;
        }

        .potree_message {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 40, 44, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            z-index: 2000;
            border: 1px solid #39474B;
            display: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        #infoMessage {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-family: Arial, sans-serif;
            font-size: 12px;
            text-align: center;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>

<body>
    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">
        <div id="potree_render_area"></div>
        <div id="potree_sidebar_container"></div>
    </div>

    <div id="infoMessage">
        <div>Usa las herramientas de medición (Distancia, Área, etc.)</div>
        <div style="font-size: 11px; color: #666;">Las mediciones se guardan automáticamente en el navegador</div>
    </div>

    <button id="toggleLayerBtn">📐 Capas</button>

    <div id="measurementLayerControl" class="measurement-layer-control">
        <button class="close-btn" id="toggleLayerPanel">✕</button>
        <h4>📐 Capas de Mediciones</h4>
        <div id="layerList"></div>
        <div class="layer-input-row">
            <input id="newLayerInput" type="text" placeholder="Nueva capa...">
            <button id="addLayerBtn">+</button>
        </div>
        <div class="layer-actions-row">
            <button id="saveMeasurementsBtn" class="btn-success">💾 Guardar</button>
            <button id="clearMeasurementsBtn" class="btn-danger">🗑 Limpiar</button>
        </div>
        <span id="measurementCount">0 mediciones</span>
    </div>

    <div id="messageContainer" class="potree_message"></div>

    <!-- Scripts -->
    <script src="./libs/jquery/jquery-3.1.1.min.js"></script>
    <script src="./libs/spectrum/spectrum.js"></script>
    <script src="./libs/jquery-ui/jquery-ui.min.js"></script>
    <script src="./libs/other/BinaryHeap.js"></script>
    <script src="./libs/tween/tween.min.js"></script>
    <script src="./libs/d3/d3.js"></script>
    <script src="./libs/proj4/proj4.js"></script>
    <script src="./libs/openlayers3/ol.js"></script>
    <script src="./libs/i18next/i18next.js"></script>
    <script src="./libs/jstree/jstree.js"></script>
    <script src="./libs/potree/potree.js"></script>
    <script src="./libs/plasio/js/laslaz.js"></script>

    <script>
        // --- Inicializar el viewer ---
        const viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
        
        viewer.setEDLEnabled(true);
        viewer.setFOV(60);
        viewer.setPointBudget(8_000_000);
        viewer.loadSettingsFromURL();
        viewer.setDescription("");
        
        viewer.loadGUI(() => {
            viewer.setLanguage('en');
            $("#menu_appearance").next().show();
            $("#menu_tools").next().show();
            $("#menu_clipping").next().show();
        });
        
        // --- Función para mostrar mensajes ---
        function showMessage(text, duration = 3000) {
            const container = document.getElementById('messageContainer');
            container.textContent = text;
            container.style.display = 'block';
            container.style.opacity = '1';
            
            if (duration) {
                clearTimeout(window.messageTimeout);
                window.messageTimeout = setTimeout(() => {
                    container.style.opacity = '0';
                    setTimeout(() => {
                        container.style.display = 'none';
                    }, 500);
                }, duration);
            }
        }

        // --- Cargar la nube de puntos ---
        console.log('Cargando nube de puntos...');
        
        Potree.loadPointCloud("./pointclouds/TEST_DATA/metadata.json", "TEST_DATA", (e) => {
            console.log('Nube de puntos cargada correctamente');
            const pointcloud = e.pointcloud;
            
            const material = pointcloud.material;
            material.size = 1;
            material.pointSizeType = Potree.PointSizeType.FIXED;
            material.shape = Potree.PointShape.CIRCLE;
            material.activeAttributeName = "rgba";
            
            viewer.scene.addPointCloud(pointcloud);
            viewer.fitToScreen();
            
            showMessage('✅ Nube de puntos cargada correctamente', 3000);
        }).catch((err) => {
            console.error('Error al cargar la nube:', err);
            showMessage('⚠️ No se pudo cargar la nube de puntos. Las mediciones aún funcionan.', 5000);
        });

        // --- Sistema de persistencia (código simplificado) ---
        class SimpleStorage {
            constructor() {
                this.storageKey = 'potree_measurements_data';
                this.layerKey = 'potree_layers_data';
                this.layers = new Set(['default']);
                this.layerColors = new Map();
                this.loadLayers();
                
                // Configurar auto-guardado
                let saveTimeout = null;
                viewer.addEventListener('update', () => {
                    if (saveTimeout) clearTimeout(saveTimeout);
                    saveTimeout = setTimeout(() => this.saveMeasurements(), 1000);
                });
                
                // Eventos de la escena
                viewer.scene.addEventListener('measurement_added', () => {
                    setTimeout(() => this.saveMeasurements(), 100);
                });
                viewer.scene.addEventListener('measurement_removed', () => {
                    this.saveMeasurements();
                });
                
                this.loadMeasurements();
                console.log('[Storage] Inicializado');
            }

            getLayerColor(name) {
                if (this.layerColors.has(name)) return this.layerColors.get(name);
                const colors = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#F7DC6F','#BB8FCE','#F1948A','#82E0AA'];
                let hash = 0;
                for (let i = 0; i < name.length; i++) {
                    hash = name.charCodeAt(i) + ((hash << 5) - hash);
                }
                const color = colors[Math.abs(hash) % colors.length];
                this.layerColors.set(name, color);
                this.saveLayers();
                return color;
            }

            addLayer(name) {
                name = name.trim();
                if (!name || this.layers.has(name)) return false;
                this.layers.add(name);
                this.saveLayers();
                return true;
            }

            removeLayer(name) {
                if (name === 'default' || !this.layers.has(name)) return false;
                this.layers.delete(name);
                this.layerColors.delete(name);
                for (const m of viewer.scene.measurements) {
                    if (m.layer === name) m.layer = 'default';
                }
                this.saveLayers();
                this.saveMeasurements();
                return true;
            }

            saveLayers() {
                try {
                    const data = { layers: Array.from(this.layers), colors: {} };
                    for (const [k, v] of this.layerColors) data.colors[k] = v;
                    localStorage.setItem(this.layerKey, JSON.stringify(data));
                } catch(e) { console.error(e); }
            }

            loadLayers() {
                try {
                    const data = JSON.parse(localStorage.getItem(this.layerKey));
                    if (data) {
                        if (data.layers) this.layers = new Set(data.layers);
                        if (data.colors) {
                            for (const [k, v] of Object.entries(data.colors)) {
                                this.layerColors.set(k, v);
                            }
                        }
                    }
                } catch(e) { console.error(e); }
                if (!this.layers.has('default')) this.layers.add('default');
            }

            saveMeasurements() {
                try {
                    const data = viewer.scene.measurements
                        .filter(m => m.persistent !== false)
                        .map(m => ({
                            type: 'line',
                            id: m._id || Date.now(),
                            uuid: m.uuid || Potree.MathUtils.generateUUID(),
                            name: m.name || 'Measurement',
                            layer: m.layer || 'default',
                            color: m.color ? m.color.toArray() : [1, 0, 0],
                            points: m.points.map(p => p.position.toArray()),
                            showDistances: m._showDistances !== undefined ? m._showDistances : true,
                            showArea: m._showArea || false,
                            closed: m._closed !== undefined ? m._closed : true,
                            showAngles: m._showAngles || false,
                            showHeight: m._showHeight || false,
                            showCircle: m._showCircle || false,
                            showAzimuth: m._showAzimuth || false,
                            showEdges: m._showEdges !== undefined ? m._showEdges : true,
                            persistent: m.persistent !== undefined ? m.persistent : true
                        }));
                    localStorage.setItem(this.storageKey, JSON.stringify(data));
                } catch(e) { console.error(e); }
            }

            loadMeasurements() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    if (!data) return;
                    const measurements = JSON.parse(data);
                    for (const m of viewer.scene.measurements) {
                        if (m.persistent !== false) viewer.scene.removeMeasurement(m);
                    }
                    for (const mData of measurements) {
                        try {
                            const measure = new Potree.Measure();
                            measure.uuid = mData.uuid || Potree.MathUtils.generateUUID();
                            measure._id = mData.id || Date.now();
                            measure.name = mData.name || 'Measurement';
                            measure.layer = mData.layer || 'default';
                            measure._showDistances = mData.showDistances !== undefined ? mData.showDistances : true;
                            measure._showArea = mData.showArea || false;
                            measure._closed = mData.closed !== undefined ? mData.closed : true;
                            measure._showAngles = mData.showAngles || false;
                            measure._showHeight = mData.showHeight || false;
                            measure._showCircle = mData.showCircle || false;
                            measure._showAzimuth = mData.showAzimuth || false;
                            measure._showEdges = mData.showEdges !== undefined ? mData.showEdges : true;
                            measure.persistent = mData.persistent !== undefined ? mData.persistent : true;
                            if (mData.color) measure.color = new THREE.Color(mData.color);
                            for (const p of mData.points) {
                                measure.addMarker(new THREE.Vector3(...p));
                            }
                            viewer.scene.addMeasurement(measure);
                        } catch(e) { console.warn('Error cargando medición:', e); }
                    }
                } catch(e) { console.error(e); }
            }

            clearAll() {
                localStorage.removeItem(this.storageKey);
                localStorage.removeItem(this.layerKey);
                this.layers = new Set(['default']);
                this.layerColors.clear();
            }
        }

        // --- UI para capas ---
        class SimpleUI {
            constructor(storage) {
                this.storage = storage;
                this.panel = document.getElementById('measurementLayerControl');
                this.toggleBtn = document.getElementById('toggleLayerBtn');
                this.closeBtn = document.getElementById('toggleLayerPanel');
                this.layerList = document.getElementById('layerList');
                this.newLayerInput = document.getElementById('newLayerInput');
                this.addBtn = document.getElementById('addLayerBtn');
                this.saveBtn = document.getElementById('saveMeasurementsBtn');
                this.clearBtn = document.getElementById('clearMeasurementsBtn');
                this.countDisplay = document.getElementById('measurementCount');
                this.visible = false;

                this.toggleBtn.addEventListener('click', () => this.toggle());
                this.closeBtn.addEventListener('click', () => this.hide());
                this.addBtn.addEventListener('click', () => this.addLayer());
                this.newLayerInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addLayer();
                });
                this.saveBtn.addEventListener('click', () => {
                    this.storage.saveMeasurements();
                    showMessage('💾 Mediciones guardadas', 2000);
                });
                this.clearBtn.addEventListener('click', () => {
                    if (confirm('¿Eliminar todas las mediciones?')) {
                        this.storage.clearAll();
                        viewer.scene.removeAllMeasurements();
                        this.render();
                        showMessage('🗑 Mediciones eliminadas', 2000);
                    }
                });

                this.storage.saveLayers = this.storage.saveLayers.bind(this.storage);
                this.render();
                setInterval(() => this.render(), 1000);
                viewer.scene.addEventListener('measurement_added', () => this.render());
                viewer.scene.addEventListener('measurement_removed', () => this.render());
            }

            toggle() {
                this.visible ? this.hide() : this.show();
            }

            show() {
                this.visible = true;
                this.panel.style.display = 'block';
                this.toggleBtn.textContent = '✕ Cerrar capas';
                this.render();
            }

            hide() {
                this.visible = false;
                this.panel.style.display = 'none';
                this.toggleBtn.textContent = '📐 Capas';
            }

            addLayer() {
                const name = this.newLayerInput.value.trim();
                if (!name) return;
                if (this.storage.addLayer(name)) {
                    this.newLayerInput.value = '';
                    // Asignar a mediciones seleccionadas
                    for (const obj of viewer.inputHandler.selection || []) {
                        if (obj instanceof Potree.Measure) obj.layer = name;
                    }
                    this.storage.saveMeasurements();
                    this.render();
                }
            }

            render() {
                const layers = Array.from(this.storage.layers);
                const stats = {};
                for (const m of viewer.scene.measurements) {
                    const layer = m.layer || 'default';
                    stats[layer] = (stats[layer] || 0) + 1;
                }

                this.layerList.innerHTML = '';
                const sorted = layers.sort((a,b) => a === 'default' ? -1 : b === 'default' ? 1 : a.localeCompare(b));

                for (const layer of sorted) {
                    const count = stats[layer] || 0;
                    const color = this.storage.getLayerColor(layer);
                    const isDefault = layer === 'default';

                    const div = document.createElement('div');
                    div.className = 'layer-item';
                    div.innerHTML = `
                        <div class="layer-name">
                            <span class="layer-color" style="background:${color}"></span>
                            <span>${layer}</span>
                            <span class="layer-count">(${count})</span>
                        </div>
                        <div class="layer-actions">
                            ${!isDefault ? `<button class="delete-layer" onclick="window._ui.storage.removeLayer('${layer}');window._ui.render();">✕</button>` : ''}
                        </div>
                    `;
                    // Visibilidad
                    const visBtn = document.createElement('button');
                    visBtn.textContent = '👁';
                    visBtn.style.opacity = '0.6';
                    visBtn.onclick = (e) => {
                        e.stopPropagation();
                        const visible = visBtn.dataset.visible !== 'false';
                        for (const m of viewer.scene.measurements) {
                            if (m.layer === layer) m.visible = !visible;
                        }
                        visBtn.dataset.visible = visible ? 'false' : 'true';
                        visBtn.style.opacity = visible ? '0.3' : '0.8';
                    };
                    div.querySelector('.layer-actions').prepend(visBtn);

                    // Seleccionar capa
                    div.onclick = () => {
                        viewer.inputHandler.deselectAll();
                        for (const m of viewer.scene.measurements) {
                            if (m.layer === layer) {
                                viewer.inputHandler.toggleSelection(m);
                            }
                        }
                    };

                    this.layerList.appendChild(div);
                }

                const count = viewer.scene.measurements.length;
                this.countDisplay.textContent = `${count} mediciones en ${layers.length} capas`;
            }
        }

        // --- Inicializar todo ---
        viewer.onGUILoaded(() => {
            console.log('GUI cargada, iniciando sistema de capas...');
            const storage = new SimpleStorage();
            window._storage = storage;
            const ui = new SimpleUI(storage);
            window._ui = ui;
            
            // Cargar mediciones guardadas
            setTimeout(() => {
                storage.loadMeasurements();
                ui.render();
                const count = viewer.scene.measurements.length;
                if (count > 0) {
                    showMessage(`📐 Cargadas ${count} mediciones`, 3000);
                }
            }, 500);
        });

        // Exponer funciones para debugging
        window.viewer = viewer;
        window.showMessage = showMessage;

        console.log('✅ Potree con sistema de capas iniciado');
    </script>
</body>
</html>
