<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>TEST DATA</title>

	<link rel="stylesheet" type="text/css" href="./libs/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./libs/potree/potree.js"></script>
	<script src="./libs/plasio/js/laslaz.js"></script>

	<!-- INCLUDE ADDITIONAL DEPENDENCIES HERE -->
	<!-- INCLUDE SETTINGS HERE -->

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area" style="background-image: url('../build/potree/resources/images/background.jpg');"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

	<script>

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(2_000_000);
		viewer.loadSettingsFromURL();

		viewer.setBackground("skybox");

		// TODO: pon tu texto/logo aqui (puede ser texto simple o un <img>)
		viewer.setDescription(`TEST DATA`);


		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
			$("#menu_tools").next().show();
			$("#menu_scene").next().show();

			viewer.toggleSidebar();

			// Seccion personalizada: Downloadable Data
			let section = $(`
				<h3 id="menu_meta" class="accordion-header ui-widget"><span>Downloadable Data</span></h3>
				<div class="accordion-content ui-widget pv-menu-list"></div>
			`);
			let content = section.last();
			content.html(`
			<div class="pv-menu-list">

			<div class="divider"><span>Coordinate System</span></div>
			<br>
				<span>TODO: escribe aqui tu sistema de coordenadas (ej. UTM 18S WGS84)</span>
			<br>
			<br>
			<div class="divider"><span>Point Cloud</span></div>
			<br>
				Click <a href="TODO_URL_DEL_LAS_AQUI">here</a> to download the .LAS
			<br>
			<br>
			<div class="divider"><span>Orthophoto</span></div>
			<br>
				Click <a href="TODO_URL_DE_LA_ORTOFOTO_AQUI">here</a> to download the .ECW
			</div>
			`);
			section.first().click(() => content.slideToggle());
			section.insertBefore($('#menu_filters'));

		});


		Potree.loadPointCloud("./pointclouds/TEST_DATA/metadata.json", "TEST_DATA", e => {
			let scene = viewer.scene;
			let pointcloud = e.pointcloud;

			let material = pointcloud.material;
			material.size = 1;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;
			material.activeAttributeName = "rgba";

			scene.addPointCloud(pointcloud);

			viewer.fitToScreen();

			// TODO: anotacion de ejemplo - reemplaza las coordenadas por puntos reales de tu nube
			// Para obtener coordenadas: navega el visor hasta el punto deseado y usa la consola (F12)
			// con: viewer.scene.view.position  y  viewer.scene.view.lookAt (o el target actual de camara)
			scene.annotations.add(new Potree.Annotation({
				position: [0, 0, 0],
				cameraPosition: [10, 0, 10],
				cameraTarget: [0, 0, 0],
				title: "TODO: TITULO DE TU ANOTACION",
				description: `
				TODO: descripcion o link, ej: Click <a href="https://tuweb.com/reporte.pdf">here</a> to open the report.
				`
			}));

		});

	</script>


  </body>
</html>
